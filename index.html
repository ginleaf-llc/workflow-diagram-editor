<!-- 方向性: 左のアプリ一覧で選択コンテキストを固定し、右側に3ビューと編集状態を展開する案。 -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Workflow Diagram Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --canvas: #eef0f2;
      --dot: #cbd1d6;
      --card: #ffffff;
      --border: #d7dbe0;
      --ink: #14181c;
      --muted: #5b6570;
      --line: #87919a;
      --teal: #0e6e73;
      --teal-soft: #e5f0f1;
      --chat: #3d6672;
      --chat-soft: #e8eff1;
      --amber: #b06a2c;
      --amber-soft: #fbefe5;
      --neutral: #65717b;
      --neutral-soft: #eef0f2;
      --shadow: 0 1px 2px rgba(20, 24, 28, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      font: 13px "Public Sans", "Noto Sans JP", system-ui, sans-serif;
    }
    button { font: inherit; }

    .app-panel,
    .bar,
    .mast,
    .note,
    .workflow-mode,
    .add-node,
    .workflow-editor,
    .other h2,
    .flow-card,
    .group label,
    .node-id,
    .node span {
      font-family: "JetBrains Mono", "Noto Sans JP", ui-monospace, monospace;
    }

    .mast {
      height: 82px;
      background: var(--ink);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .mast h1 { font-size: 15px; margin: 0; width: auto; }
    .mast h1 span {
      display: block;
      color: #9aa4ad;
      font-size: 9px;
      letter-spacing: .14em;
      margin-bottom: 5px;
    }
    .meta { text-align: right; color: #9aa4ad; font-size: 10px; }
    .meta b { display: block; color: white; font-size: 12px; margin-bottom: 4px; }

    .shell {
      display: grid;
      grid-template-columns: 245px minmax(0, 1fr);
      height: 100vh;
      min-height: 0;
    }
    .app-panel {
      display: flex;
      min-height: 0;
      flex-direction: column;
      padding: 18px 14px 14px;
      background: #f8f9fa;
      border-right: 1px solid var(--border);
    }
    .app-panel-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 0 7px;
    }
    .app-panel-header strong { font-size: 11px; letter-spacing: .1em; }
    .app-panel-header small { color: var(--muted); font-size: 9px; }
    .app-search {
      position: relative;
      display: block;
      margin: 14px 5px 12px;
    }
    .app-search input {
      width: 100%;
      padding: 9px 10px 9px 30px;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
      font-size: 11px;
    }
    .app-search input:focus { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal-soft); }
    .app-search input::placeholder { color: #89939c; }
    .app-search-icon {
      position: absolute;
      top: 10px;
      left: 11px;
      width: 11px;
      height: 11px;
      border: 1.5px solid var(--muted);
      border-radius: 50%;
      pointer-events: none;
    }
    .app-search-icon::after {
      content: "";
      position: absolute;
      right: -4px;
      bottom: -3px;
      width: 5px;
      height: 1.5px;
      background: var(--muted);
      transform: rotate(45deg);
      transform-origin: left center;
    }
    .app-list {
      display: grid;
      min-height: 0;
      flex: 1 1 auto;
      gap: 4px;
      overflow-y: auto;
      padding: 2px 4px 6px;
      scrollbar-color: #b8c0c6 transparent;
      scrollbar-width: thin;
    }
    .app {
      width: 100%;
      min-height: 57px;
      padding: 10px 11px;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      text-align: left;
      cursor: pointer;
      transition: background .1s ease-out;
    }
    .app:hover { background: #f0f3f4; }
    .app b { display: block; overflow: hidden; color: var(--ink); font-size: 11px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .app small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }
    .app.active {
      background: var(--card);
      border-color: var(--border);
      box-shadow: inset 2px 0 0 var(--teal);
    }
    .app.active b { color: var(--teal); }
    .app-panel-footer {
      margin: 10px 5px 0;
      padding: 12px 7px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 9px;
      line-height: 1.5;
    }
    .app-panel-footer strong { display: block; color: var(--ink); font-size: 10px; }

    .workspace {
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-rows: 58px minmax(0, 1fr);
    }

    .bar {
      min-width: 0;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 4px;
    }
    .bar strong { margin-right: 24px; color: var(--ink); font-size: 12px; letter-spacing: .02em; }
    .tab {
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      background: transparent;
      padding: 20px 12px 18px;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
      transition: color .1s ease-out, border-color .1s ease-out;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { background: transparent; color: var(--teal); border-bottom-color: var(--teal); }
    .bar .tools { margin-left: auto; display: flex; gap: 7px; }
    .tools button {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 4px;
      padding: 8px 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .tools .primary { color: white; background: var(--teal); border-color: var(--teal); }
    .tools button:disabled { cursor: not-allowed; opacity: .52; }

    .stage {
      min-height: 0;
      position: relative;
      overflow: auto;
      background-image: radial-gradient(circle, var(--dot) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
    }
    .view { will-change: opacity, transform; }
    .view.is-entering { animation: view-enter .18s ease-out both; }
    .view.is-leaving { animation: view-leave .18s ease-out both; }
    @keyframes view-enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes view-leave {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-8px); }
    }
    .board { position: relative; width: 1230px; min-height: 700px; padding: 24px 30px; }
    .workflow-canvas {
      position: relative;
      width: 860px;
      height: 620px;
      border: 1px solid transparent;
      border-radius: 4px;
      transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .workflow-canvas .note { top: 0; left: 0; }
    .workflow-canvas .group { z-index: 0; }
    .workflow-canvas > svg { position: absolute; inset: 0; z-index: 1; }
    .workflow-canvas .node { z-index: 2; width: 170px; }
    .workflow-canvas .node-actions { z-index: 3; }
    .workflow-mode {
      position: absolute;
      top: 3px;
      right: 114px;
      display: inline-flex;
      z-index: 4;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      visibility: hidden;
      opacity: 0;
      color: var(--teal);
      background: var(--card);
      border: 1px solid var(--teal);
      border-radius: 3px;
      font-size: 9px;
      font-weight: 800;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity .18s ease-out, transform .18s ease-out, visibility .18s ease-out;
    }
    .workflow-mode::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--teal);
    }
    .add-node {
      position: absolute;
      top: 3px;
      right: 0;
      display: inline-flex;
      z-index: 4;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      color: white;
      visibility: hidden;
      opacity: 0;
      background: var(--teal);
      border: 1px solid var(--teal);
      border-radius: 3px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity .18s ease-out, transform .18s ease-out, visibility .18s ease-out;
    }
    .add-node::before {
      content: "";
      width: 12px;
      height: 12px;
      border: 1px solid #ffffffaa;
      border-radius: 2px;
      background: linear-gradient(#fff, #fff) center / 7px 1px no-repeat, linear-gradient(#fff, #fff) center / 1px 7px no-repeat;
    }
    .board.editing .workflow-canvas {
      background: #e5f0f166;
      border-color: var(--teal);
      box-shadow: inset 0 0 0 2px #e5f0f199;
    }
    .board.editing .workflow-mode,
    .board.editing .add-node {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .node:hover { border-color: var(--teal); transform: translateY(-1px); }
    .board.editing .node { cursor: pointer; }
    .workflow-node {
      user-select: none;
      touch-action: none;
    }
    .board.editing .workflow-node { cursor: grab; }
    .board.editing .workflow-node.dragging {
      z-index: 5;
      cursor: grabbing;
      transform: none;
      box-shadow: 0 4px 8px rgba(0, 0, 0, .1), 0 16px 32px -8px rgba(0, 0, 0, .22);
      transition: none;
    }
    .board.editing .node:hover,
    .board.editing .node.selected {
      border-color: var(--teal);
      box-shadow: 0 0 0 2px var(--teal-soft), var(--shadow);
    }
    .node-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transform: translateY(-3px);
      transition: opacity .15s ease, transform .15s ease;
    }
    .board.editing .node:hover .node-actions,
    .board.editing .node.selected .node-actions {
      opacity: 1;
      transform: translateY(0);
    }
    .node-action {
      position: relative;
      display: grid;
      width: 22px;
      height: 22px;
      padding: 0;
      place-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
    }
    .node-action:hover { border-color: var(--accent); background: var(--soft); }
    .node-action.edit::before {
      content: "";
      width: 9px;
      height: 4px;
      border: 1.5px solid var(--accent);
      border-radius: 1px;
      transform: rotate(-45deg);
    }
    .node-action.edit::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 1.5px;
      background: var(--accent);
      transform: translate(-4px, 4px) rotate(-45deg);
    }
    .node-action.delete::before,
    .node-action.delete::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 1.5px;
      background: var(--accent);
      transform: rotate(45deg);
    }
    .node-action.delete::after { transform: rotate(-45deg); }
    .workflow-editor {
      position: absolute;
      top: 24px;
      left: 900px;
      width: 300px;
      padding: 18px;
      visibility: hidden;
      opacity: 0;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
      transform: translateX(16px);
      transition: opacity .2s ease-out, transform .2s ease-out, visibility .2s ease-out;
    }
    .board.editing .workflow-editor {
      visibility: visible;
      opacity: 1;
      transform: translateX(0);
    }
    .workflow-editor[aria-hidden="true"] {
      visibility: hidden;
      opacity: 0;
      transform: translateX(16px);
      pointer-events: none;
    }
    .workflow-editor.is-switching { animation: editor-switch .2s ease-out both; }
    @keyframes editor-switch {
      from { opacity: .35; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .editor-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .editor-kicker {
      display: block;
      color: var(--teal);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .14em;
    }
    .editor-header h2 { margin: 5px 0 0; font-size: 15px; }
    .editor-status {
      flex: 0 0 auto;
      padding: 4px 6px;
      color: var(--teal);
      background: transparent;
      border: 1px solid var(--teal);
      border-radius: 2px;
      font-size: 8px;
      font-weight: 800;
    }
    .editor-form { display: grid; gap: 13px; padding-top: 16px; }
    .editor-field { display: grid; gap: 6px; }
    .editor-field label { color: var(--muted); font-size: 9px; font-weight: 800; }
    .editor-field input,
    .editor-field textarea,
    .editor-field select {
      width: 100%;
      padding: 8px 9px;
      color: var(--ink);
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 3px;
      outline: none;
      font-size: 10px;
    }
    .editor-field textarea { min-height: 54px; resize: vertical; line-height: 1.5; }
    .editor-field input:focus,
    .editor-field textarea:focus,
    .editor-field select:focus { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal-soft); }
    .editor-actions { display: flex; justify-content: flex-end; gap: 7px; padding-top: 4px; }
    .editor-actions button {
      padding: 7px 9px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      font-size: 9px;
      font-weight: 800;
    }
    .editor-actions .save { color: white; background: var(--teal); border-color: var(--teal); }
    .editor-hint { margin: 13px 0 0; color: var(--muted); font-size: 9px; line-height: 1.55; }
    .note {
      position: absolute;
      top: 24px;
      left: 30px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
    }
    .note b { display: block; font-size: 11px; }
    .note small { color: var(--muted); }
    .group {
      position: absolute;
      border: 1px dashed #b8c0c6;
      border-radius: 4px;
      background: #fff5;
    }
    .group label {
      position: absolute;
      left: 15px;
      top: 12px;
      font-size: 9px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .08em;
    }
    .node {
      position: absolute;
      width: 186px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 13px 12px;
      box-shadow: var(--shadow);
      transition: border-color .1s ease-out, transform .1s ease-out, box-shadow .1s ease-out;
    }
    .node-id {
      display: block;
      color: var(--muted);
      font-size: 8px;
      line-height: 1;
      letter-spacing: .12em;
    }
    .node h3 {
      margin: 8px 0 4px;
      padding-right: 38px;
      color: var(--ink);
      font: 700 12px/1.3 "JetBrains Mono", "Noto Sans JP", ui-monospace, monospace;
    }
    .node p {
      font: 10px/1.5 "Public Sans", "Noto Sans JP", system-ui, sans-serif;
      color: var(--muted);
      margin: 0;
    }
    .node span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      border-radius: 0;
      margin-top: 10px;
      padding: 0;
      color: var(--accent);
      background: transparent;
      letter-spacing: .02em;
    }
    .node span::before {
      content: "";
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      background: var(--accent);
    }
    .agent { --accent: var(--teal); --soft: var(--teal-soft); }
    .chat { --accent: var(--chat); --soft: var(--chat-soft); }
    .future { --accent: var(--amber); --soft: var(--amber-soft); border-style: dashed; }
    .none { --accent: var(--neutral); --soft: var(--neutral-soft); }
    .flow-board > svg { position: absolute; inset: 0; }
    .wire { fill: none; stroke: var(--line); stroke-width: 2; marker-end: url(#a); }

    .other {
      margin: 35px auto;
      width: min(900px, 90%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 28px;
      box-shadow: var(--shadow);
    }
    .other h2 { margin: 0 0 6px; }
    .other > p { color: var(--muted); }
    .hidden { display: none; }

    .empty-state {
      display: grid;
      min-height: 260px;
      place-content: center;
      gap: 8px;
      margin-top: 20px;
      padding: 32px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }
    .empty-state .empty-kicker {
      color: var(--amber);
      font: 800 9px/1.2 "JetBrains Mono", "Noto Sans JP", ui-monospace, monospace;
      letter-spacing: .14em;
    }
    .empty-state h3 { margin: 0; font-size: 14px; }
    .empty-state p { margin: 0; color: var(--muted); font-size: 11px; }
    .workflow-canvas .empty-state {
      position: absolute;
      top: 105px;
      left: 20px;
      width: 820px;
      min-height: 360px;
      margin: 0;
    }

    /* UI preview: a neutral product surface inside the architecture shell. */
    .ui-preview {
      display: grid;
      grid-template-columns: 184px minmax(0, 1fr);
      min-height: 405px;
      margin-top: 20px;
      overflow: hidden;
      color: var(--ink);
      background: #f7f8f9;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }
    .ui-sidebar {
      padding: 18px 14px;
      background: var(--card);
      border-right: 1px solid var(--border);
    }
    .ui-brand { display: flex; align-items: center; gap: 9px; margin: 1px 5px 24px; }
    .ui-logo {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 4px;
      color: #fff;
      background: var(--teal);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .04em;
    }
    .ui-brand strong { display: block; color: var(--ink); font: 700 12px/1.2 "JetBrains Mono", "Noto Sans JP", ui-monospace, monospace; }
    .ui-brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; }
    .ui-section-label {
      margin: 0 7px 8px;
      color: #7c8790;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .ui-source-nav { display: grid; gap: 4px; }
    .ui-source {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 9px 8px;
      color: var(--muted);
      border-radius: 4px;
      text-decoration: none;
      transition: background .1s ease-out;
    }
    .ui-source:hover { background: #f0f3f4; }
    .ui-source.active { color: var(--ink); background: var(--teal-soft); }
    .ui-source-mark {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      margin-top: 4px;
      border: 1px solid #aeb7bf;
    }
    .ui-source.active .ui-source-mark { border-color: var(--teal); background: var(--teal); }
    .ui-source b { display: block; font-size: 10px; font-weight: 700; }
    .ui-source small { display: block; margin-top: 3px; color: #9aa2aa; font-size: 9px; }
    .ui-sidebar-footer {
      margin-top: 24px;
      padding: 14px 7px 0;
      border-top: 1px solid var(--border);
    }
    .ui-sidebar-footer span { display: block; color: #9aa2aa; font-size: 9px; }
    .ui-sidebar-footer b { display: block; margin-top: 5px; color: var(--ink); font: 700 10px/1.3 "JetBrains Mono", "Noto Sans JP", ui-monospace, monospace; }
    .ui-sidebar-footer small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .ui-main { min-width: 0; padding: 23px 24px 20px; background: #f7f8f9; }
    .ui-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .ui-eyebrow { color: var(--teal); font: 700 8px/1.2 "JetBrains Mono", "Noto Sans JP", ui-monospace, monospace; letter-spacing: .13em; }
    .ui-main h3 { margin: 5px 0 3px; color: var(--ink); font: 700 17px/1.25 "JetBrains Mono", "Noto Sans JP", ui-monospace, monospace; letter-spacing: -.02em; }
    .ui-main p { margin: 0; color: var(--muted); font: 10px/1.5 "Public Sans", "Noto Sans JP", system-ui, sans-serif; }
    .ui-filter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      padding: 7px 9px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      font-family: "JetBrains Mono", "Noto Sans JP", ui-monospace, monospace;
    }
    .ui-filter-caret {
      width: 6px;

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function hasAppData(appName) {
      return Object.prototype.hasOwnProperty.call(APP_DATA, appName);
    }

    function workflowStorageKey(appName) {
      return WORKFLOW_STORAGE_PREFIX + appName + ':workflow';
    }

    function defaultWorkflow(appName) {
      return hasAppData(appName) ? clone(APP_DATA[appName].workflow) : null;
    }

    function numberOr(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function normalizeWorkflowState(saved, appName) {
      const fallback = defaultWorkflow(appName);
      if (!saved || !Array.isArray(saved.nodes) || !fallback) return fallback;

      const usedIds = new Set();
      const nodes = saved.nodes.map((rawNode, index) => {
        const fallbackNode = fallback.nodes[index] || {};
        let id = String(rawNode.id || fallbackNode.id || 'n' + (index + 1));
        while (usedIds.has(id)) id += '-' + index;
        usedIds.add(id);
        const kind = KINDS.includes(rawNode.kind) ? rawNode.kind : (KINDS.includes(rawNode.type) ? rawNode.type : (fallbackNode.kind || 'none'));
        return {
          id,
          displayId: String(rawNode.displayId || fallbackNode.displayId || 'N' + String(index + 1).padStart(2, '0')),
          x: Math.max(0, numberOr(rawNode.x, fallbackNode.x || 0)),
          y: Math.max(0, numberOr(rawNode.y, fallbackNode.y || 0)),
          kind,
          title: String(rawNode.title == null ? (rawNode.name == null ? (fallbackNode.title || '無題') : rawNode.name) : rawNode.title),
          description: String(rawNode.description == null ? (rawNode.sub == null ? (fallbackNode.description || '') : rawNode.sub) : rawNode.description)
        };
      });

      const nodeIds = new Set(nodes.map(node => node.id));
      const savedWires = Array.isArray(saved.wires) ? saved.wires : fallback.wires;
      const wires = savedWires.map((wire, index) => {
        const from = Array.isArray(wire) ? wire[0] : wire && wire.from;
        const to = Array.isArray(wire) ? wire[1] : wire && wire.to;
        return { id: String((wire && wire.id) || 'w' + (index + 1)), from: String(from || ''), to: String(to || '') };
      }).filter(wire => nodeIds.has(wire.from) && nodeIds.has(wire.to) && wire.from !== wire.to);
      const maxNodeNumber = nodes.reduce((max, node) => {
        const match = node.id.match(/(\d+)$/);
        return Math.max(max, match ? Number(match[1]) : 0);
      }, 0);

      return {
        note: fallback.note,
        groups: fallback.groups,
        nodes,
        wires,
        nextId: Math.max(1, numberOr(saved.nextId, maxNodeNumber + 1), maxNodeNumber + 1)
      };
    }

    function loadWorkflowState(appName) {
      const fallback = defaultWorkflow(appName);
      if (!fallback) return null;
      try {
        const raw = window.localStorage.getItem(workflowStorageKey(appName));
        return raw ? normalizeWorkflowState(JSON.parse(raw), appName) : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function saveWorkflowState() {
      if (!workflowState || !hasAppData(app)) return;
      const payload = {
        version: 1,
        nodes: workflowState.nodes.map(node => ({
          id: node.id,
          displayId: node.displayId,
          x: node.x,
          y: node.y,
          kind: node.kind,
          title: node.title,
          description: node.description
        })),
        wires: workflowState.wires,
        nextId: workflowState.nextId
      };
      try { window.localStorage.setItem(workflowStorageKey(app), JSON.stringify(payload)); } catch (error) {}
    }

    function selectNode(node) {
      if (!editing || !workflowState || !node) return;
      const nodeData = workflowState.nodes.find(item => item.id === node.dataset.id);

    function createWorkflowNode(nodeData) {
      const node = document.createElement('article');
      node.className = 'node ' + nodeData.kind + ' workflow-node';
      node.dataset.id = nodeData.id;

      node.querySelector('.node-actions').setAttribute('aria-label', nodeData.title + 'の操作');

      if (selectedNodeId === nodeData.id) node.classList.add('selected');
      bindWorkflowNode(node, nodeData);
      return node;
    }

    function bindWorkflowNode(node, nodeData) {
      node.addEventListener('click', event => {
        if (!editing || event.target.closest('.node-action')) return;
        selectNode(node);

      node.querySelector('.node-action.edit').addEventListener('click', event => {

      node.querySelector('.node-action.delete').addEventListener('click', event => {
        event.stopPropagation();

        const wasSelected = selectedNodeId === nodeData.id;
        workflowState.nodes = workflowState.nodes.filter(item => item.id !== nodeData.id);
        workflowState.wires = workflowState.wires.filter(wire => wire.from !== nodeData.id && wire.to !== nodeData.id);
        if (wasSelected) selectedNodeId = workflowState.nodes[0] ? workflowState.nodes[0].id : null;
        saveWorkflowState();
        renderWorkflow();
      });
      node.addEventListener('pointerdown', event => {

      });
    }

    const DRAG_THRESHOLD = 4;

    function canvasScale() {
      const unscaledWidth = workflowCanvas.offsetWidth || 860;
      return workflowCanvas.getBoundingClientRect().width / unscaledWidth || 1;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function startNodeDrag(event, node, nodeData) {
      if (!editing || !workflowState) return;
      const pointerId = event.pointerId;
      const startX = event.clientX;
      const startY = event.clientY;
      const originalRect = node.getBoundingClientRect();
      const scale = canvasScale();
      const grabX = (event.clientX - originalRect.left) / scale;
      const grabY = (event.clientY - originalRect.top) / scale;
      let dragging = false;

      function move(moveEvent) {
        if (moveEvent.pointerId !== pointerId) return;
        const dx = moveEvent.clientX - startX;
        const dy = moveEvent.clientY - startY;
        if (!dragging) {
          if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
          dragging = true;
          if (node.setPointerCapture) node.setPointerCapture(pointerId);
          node.classList.add('dragging');
        }
        moveEvent.preventDefault();
        const rect = workflowCanvas.getBoundingClientRect();
        const currentScale = canvasScale();
        const maxX = Math.max(0, workflowCanvas.clientWidth - node.offsetWidth);
        const maxY = Math.max(0, workflowCanvas.clientHeight - node.offsetHeight);
        nodeData.x = Math.round(clamp((moveEvent.clientX - rect.left) / currentScale - grabX, 0, maxX));
        nodeData.y = Math.round(clamp((moveEvent.clientY - rect.top) / currentScale - grabY, 0, maxY));
        node.style.left = nodeData.x + 'px';
        node.style.top = nodeData.y + 'px';
        drawWorkflowWires();
      }

      function finish(finishEvent) {
        if (finishEvent && finishEvent.pointerId !== pointerId) return;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', finish);
        window.removeEventListener('pointercancel', finish);
        if (!dragging) return;
        if (node.releasePointerCapture) {
          try { node.releasePointerCapture(pointerId); } catch (error) {}
        }
        node.classList.remove('dragging');
        drawWorkflowWires();
        saveWorkflowState();
      }

      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', finish);
      window.addEventListener('pointercancel', finish);
    }

    const WORKFLOW_NODE_FALLBACK_WIDTH = 170;
    const WORKFLOW_NODE_FALLBACK_HEIGHT = 112;

    function edgePoint(from, to, fromWidth, fromHeight, toWidth = fromWidth, toHeight = fromHeight) {
      const fx = from.x + fromWidth / 2;
      const fy = from.y + fromHeight / 2;
      const tx = to.x + toWidth / 2;
      const ty = to.y + toHeight / 2;
      const dx = tx - fx;
      const dy = ty - fy;
      if (Math.abs(dx) > Math.abs(dy)) {
        const sx = fx + (dx > 0 ? fromWidth / 2 : -fromWidth / 2);
        return { x: sx, y: fy + dy * ((sx - fx) / (dx || 1)) };
      }
      const sy = fy + (dy > 0 ? fromHeight / 2 : -fromHeight / 2);
      return { x: fx + dx * ((sy - fy) / (dy || 1)), y: sy };
    }

    function wirePath(from, to, fromWidth, fromHeight, toWidth = fromWidth, toHeight = fromHeight) {
      const start = edgePoint(from, to, fromWidth, fromHeight, toWidth, toHeight);
      const end = edgePoint(to, from, toWidth, toHeight, fromWidth, fromHeight);
      const midX = (start.x + end.x) / 2;
      return 'M ' + start.x + ' ' + start.y + ' C ' + midX + ' ' + start.y + ' ' + midX + ' ' + end.y + ' ' + end.x + ' ' + end.y;
    }

    function workflowNodeSize(nodeData) {
      const node = workflowNodeElement(nodeData.id);
      return {
        width: node && node.offsetWidth ? node.offsetWidth : WORKFLOW_NODE_FALLBACK_WIDTH,
        height: node && node.offsetHeight ? node.offsetHeight : WORKFLOW_NODE_FALLBACK_HEIGHT
      };
    }

    function drawWorkflowWires() {
      workflowWires.innerHTML = '<defs><marker id="workflowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#87919a"></path></marker></defs>';
      if (!workflowState) return;
      const byId = Object.fromEntries(workflowState.nodes.map(node => [node.id, node]));
      const sizeById = Object.fromEntries(workflowState.nodes.map(node => [node.id, workflowNodeSize(node)]));
      workflowState.wires.forEach(wire => {
        const from = byId[wire.from];
        const to = byId[wire.to];
        if (!from || !to) return;
        const fromSize = sizeById[from.id];
        const toSize = sizeById[to.id];
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('class', 'wire');
        path.setAttribute('d', wirePath(from, to, fromSize.width, fromSize.height, toSize.width, toSize.height));
        path.setAttribute('marker-end', 'url(#workflowArrow)');
        workflowWires.appendChild(path);
      });
    }

    function renderWorkflow() {
      updateContext();
      workflowGroups.replaceChildren();
      workflowNodes.replaceChildren();
      workflowWires.innerHTML = '';
      workflowMode.hidden = !workflowState;
      addNode.hidden = !workflowState;
      workflow.classList.toggle('editing', editing && Boolean(workflowState));

      if (!workflowState) {
        workflowNodes.innerHTML = emptyStateMarkup('ワークフロー');
        hideNodeEditor();
        return;
      }

      workflowState.groups.forEach(groupData => {
        const group = document.createElement('div');
        group.className = 'group';
        group.style.left = groupData.left + 'px';
        group.style.top = groupData.top + 'px';
        group.style.width = groupData.width + 'px';
        group.style.height = groupData.height + 'px';
        const label = document.createElement('label');
        label.textContent = groupData.label;
        group.appendChild(label);
        workflowGroups.appendChild(group);
      });
      workflowState.nodes.forEach(nodeData => workflowNodes.appendChild(createWorkflowNode(nodeData)));
      drawWorkflowWires();

      if (!workflowState.nodes.some(node => node.id === selectedNodeId)) selectedNodeId = null;
      if (workflowState.nodes.length === 0) {
        workflowNodes.innerHTML = '<div class="empty-state"><span class="empty-kicker">EMPTY WORKFLOW</span><h3>ノードがありません</h3><p>編集モードでノードを追加できます</p></div>';
        hideNodeEditor();
      } else if (editing) {
        const node = workflowNodeElement(selectedNodeId || workflowState.nodes[0].id);
        selectNode(node);
      } else {
        hideNodeEditor();
      }
    }

    function buildUiMarkup(data) {

    function renderDataView() {
      const data = hasAppData(app) ? APP_DATA[app].data : null;
      dataDescription.textContent = data ? '選択アプリ内外のデータの流れと責任境界を、リクエスト単位で確認するビューです。' : 'このアプリの構成はまだ登録されていません';
      dataContent.innerHTML = data ? buildDataMarkup(data) : emptyStateMarkup('データフロー');
    }

    function updateEditControls() {
      const canEdit = Boolean(workflowState);
      if (!canEdit) {
        editing = false;
        selectedNodeId = null;
      }
      editToggle.disabled = !canEdit;
      resetWorkflow.disabled = !canEdit;
      editToggle.textContent = editing ? '閲覧に戻る' : '編集する';
      editToggle.setAttribute('aria-pressed', String(editing));
      workflowMode.textContent = editing ? '編集モード' : '閲覧モード';
    }

    function activateApp(nextApp) {
      if (nextApp === app) return;
      app = nextApp;
      appButtons.forEach(button => button.classList.toggle('active', button.dataset.app === app));
      workflowState = loadWorkflowState(app);
      selectedNodeId = null;
      updateEditControls();
      renderWorkflow();
      renderUiView();
      renderDataView();
    }

    appButtons.forEach(button => button.addEventListener('click', () => activateApp(button.dataset.app)));

    document.getElementById('appSearch').addEventListener('input', event => {
      const query = event.target.value.trim().toLowerCase();
      appButtons.forEach(button => {
        button.hidden = query !== '' && !button.dataset.app.toLowerCase().includes(query);
      });
    });

    function switchView(nextView) {
      if (nextView === view) return;
      const nextViewEl = document.getElementById(nextView);
      const currentViewEl = [...views].find(element => !element.classList.contains('hidden'));
      view = nextView;
      tabs.forEach(button => button.classList.toggle('active', button.dataset.view === nextView));
      if (viewSwapTimer) window.clearTimeout(viewSwapTimer);
      views.forEach(element => {
        if (element !== currentViewEl && element !== nextViewEl) {
          element.classList.add('hidden');
          element.classList.remove('is-entering', 'is-leaving');
        }
      });
      if (currentViewEl && currentViewEl !== nextViewEl) {
        currentViewEl.classList.remove('is-entering');
        currentViewEl.classList.add('is-leaving');
        viewSwapTimer = window.setTimeout(() => {
          currentViewEl.classList.add('hidden');
          currentViewEl.classList.remove('is-leaving');
        }, 180);
      }
      nextViewEl.classList.remove('hidden', 'is-leaving');
      requestAnimationFrame(() => nextViewEl.classList.add('is-entering'));
      window.setTimeout(() => nextViewEl.classList.remove('is-entering'), 200);
    }

    tabs.forEach(button => button.addEventListener('click', () => switchView(button.dataset.view)));

    editToggle.addEventListener('click', () => {
      if (!workflowState) return;
      editing = !editing;
      updateEditControls();
      renderWorkflow();
    });

    resetWorkflow.addEventListener('click', () => {
      if (!workflowState) return;
      try { window.localStorage.removeItem(workflowStorageKey(app)); } catch (error) {}
      workflowState = defaultWorkflow(app);
      selectedNodeId = null;
      renderWorkflow();
    });

    addNode.addEventListener('click', () => {
      if (!editing || !workflowState) return;
      const slot = workflowState.nodes.length;
      let id = 'n' + workflowState.nextId++;
      const existingIds = new Set(workflowState.nodes.map(node => node.id));
      while (existingIds.has(id)) id = 'n' + workflowState.nextId++;
      const x = 55 + (slot % 4) * 190;
      const y = Math.min(500, 505 + Math.floor(slot / 4) * 100);
      const nodeData = {
        id,
        displayId: 'N' + String(workflowState.nextId - 1).padStart(2, '0'),
        x,
        y,
        kind: 'none',
        title: '新しいノード',
        description: '追加したステップの説明'
      };
      workflowState.nodes.push(nodeData);
      selectedNodeId = nodeData.id;
      saveWorkflowState();
      renderWorkflow();
    });

    nodeForm.addEventListener('submit', event => {
      event.preventDefault();
      if (!editing || !workflowState || !selectedNodeId) return;
      const nodeData = workflowState.nodes.find(node => node.id === selectedNodeId);
      if (!nodeData) return;
      nodeData.title = nodeTitle.value.trim() || '名称未設定';
      nodeData.description = nodeDescription.value.trim() || '説明未設定';
      nodeData.kind = KINDS.includes(nodeType.value) ? nodeType.value : 'none';
      saveWorkflowState();
      renderWorkflow();
      const renderedNode = workflowNodeElement(nodeData.id);
      if (renderedNode) {
        selectNode(renderedNode);
        editorStatus.textContent = '保存済み';
      }
    });

    document.getElementById('cancelNode').addEventListener('click', () => {
      const node = workflowNodeElement(selectedNodeId);
      if (node) selectNode(node);
    });

    workflowState = loadWorkflowState(app);
    updateEditControls();
    renderWorkflow();
    renderUiView();
    renderDataView();
  </script>
</body>
</html>
